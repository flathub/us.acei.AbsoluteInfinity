id: us.acei.AbsoluteInfinity
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: AbsoluteInfinity

finish-args:
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=ipc

modules:
  - name: AbsoluteInfinity
    buildsystem: simple
    sources:
      - type: archive
        url: https://project4.aceius.org/binaries/flatpak-linux-x64-0.8.0.zip
        sha256: 6087f978359765171ebeb0714baa88e5af9fce209c326176f768daf1a5c60bde
        dest: game
        strip-components: 0
      - type: file
        path: Package/us.acei.AbsoluteInfinity.metainfo.xml
        dest: Package
      - type: file
        path: Package/icon-256.png
        dest: Package
      - type: file
        path: Package/icon-128.png
        dest: Package
      - type: file
        path: Package/flatpak.desktop
        dest: Package
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/bin
      - cp -r game/. ${FLATPAK_DEST}/bin/
      - chmod +x ${FLATPAK_DEST}/bin/AbsoluteInfinity
      - install -Dm644 Package/us.acei.AbsoluteInfinity.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 Package/icon-256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/us.acei.AbsoluteInfinity.png
      - install -Dm644 Package/icon-128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/us.acei.AbsoluteInfinity.png
      - install -Dm644 Package/flatpak.desktop ${FLATPAK_DEST}/share/applications/us.acei.AbsoluteInfinity.desktop
